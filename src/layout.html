<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://psesapmlbjukmdnxkcrv.supabase.co; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="alternate" hreflang="{{ otherCode }}" href="{{ otherHref }}">
<link rel="icon" href="{{ root }}icon.png">
<link rel="stylesheet" href="{{ root }}style.css">
<script src="{{ root }}motion.js"></script>
</head>
<body data-page="{{ page }}">
<a class="skip" href="#main">{{ skipToContent }}</a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="index.html"><img src="{{ root }}icon.png" alt="" width="28" height="28"> rinq</a>
    <nav aria-label="{{ navLabel }}">
      <a href="index.html#download">{{ navDownload }}</a>
      <a href="index.html#pro">{{ navPro }}</a>
      <a href="index.html#reviews">{{ navReviews }}</a>
      <a href="{{ otherHref }}" lang="{{ otherCode }}" hreflang="{{ otherCode }}">{{ otherLang }}</a>
      <button class="theme-switch" type="button" aria-label="{{ themeSwitch }}" title="{{ themeSwitch }}"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </nav>
  </div>
</header>
<main id="main" class="page-{{ page }}">
{{ contentHtml }}
</main>
<footer class="foot">
  <div class="wrap">
    <nav aria-label="{{ footLabel }}">
      <a href="terms.html">{{ footTerms }}</a>
      <a href="privacy.html">{{ footPrivacy }}</a>
      <a href="refunds.html">{{ footRefunds }}</a>
      <a href="index.html#complain">{{ footComplain }}</a>
    </nav>
    <p>rinq · {{ operatorHtml }}, {{ countryHtml }} · {{ emailHtml }}</p>
    <p>{{ footNoCookies }}</p>
  </div>
</footer>
</body>
</html>
