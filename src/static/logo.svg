<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The rinq logo: the Ring Dots mark from the owner's logo artifact, kept in the two-colour split.
       Twelve dots on a dial with a bigger one where "today" sits, a unit thicker than the artifact so they still read at 16 px; the tile is cut corner to corner,
       cream above and vermilion below, and the dots are ink on the cream half and white on the red. -->
  <defs>
    <linearGradient id="rinq-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4583f"/>
      <stop offset="1" stop-color="#c8402a"/>
    </linearGradient>
    <clipPath id="rinq-tile"><rect width="100" height="100" rx="22"/></clipPath>
    <clipPath id="rinq-upper"><path d="M0 0H100L0 100Z"/></clipPath>
    <clipPath id="rinq-lower"><path d="M100 0V100H0Z"/></clipPath>
    <g id="rinq-dots">
      <circle cx="84" cy="50" r="5.5"/>
      <circle cx="79.4" cy="67" r="5.5"/>
      <circle cx="67" cy="79.4" r="5.5"/>
      <circle cx="50" cy="84" r="5.5"/>
      <circle cx="33" cy="79.4" r="5.5"/>
      <circle cx="20.6" cy="67" r="5.5"/>
      <circle cx="16" cy="50" r="5.5"/>
      <circle cx="20.6" cy="33" r="5.5"/>
      <circle cx="33" cy="20.6" r="5.5"/>
      <circle cx="50" cy="16" r="8.5"/>
      <circle cx="67" cy="20.6" r="5.5"/>
      <circle cx="79.4" cy="33" r="5.5"/>
    </g>
  </defs>
  <g clip-path="url(#rinq-tile)">
    <g clip-path="url(#rinq-upper)">
      <rect width="100" height="100" fill="#efeae0"/>
      <use href="#rinq-dots" fill="#19191c"/>
    </g>
    <g clip-path="url(#rinq-lower)">
      <rect width="100" height="100" fill="url(#rinq-red)"/>
      <use href="#rinq-dots" fill="#fff"/>
    </g>
    <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" fill="none" stroke="#000" stroke-opacity="0.1"/>
  </g>
</svg>
